# Routes /mcp on the Gateway to the MCP server. Backend + route share the gateway's
# namespace, and the target is addressed by DNS name, so no ReferenceGrant is needed.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-backend
  namespace: agentgateway-system
spec:
  mcp:
    failureMode: FailClosed        # (default) if the target is down, the session fails; nothing bypasses
    # prefixMode default "Conditional": with ONE target, tool names stay unprefixed (echo, get-sum).
    # Adding a 2nd target would prefix them (everything_echo) -> update the M5 authz rules.
    targets:
    - name: everything
      static:
        host: mcp-everything.tools.svc.cluster.local
        port: 3001
        protocol: StreamableHTTP   # path defaults to /mcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-proxy
    namespace: agentgateway-system
  rules:
  - matches:
    - path: { type: PathPrefix, value: /mcp }
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp-backend
