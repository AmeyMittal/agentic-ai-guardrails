# MCP tool server in the "tools" namespace. Only the gateway should talk to it (enforced in M7).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-everything
  namespace: tools
  labels: { app: mcp-everything }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-everything }
  template:
    metadata:
      labels: { app: mcp-everything }
    spec:
      containers:
      - name: server
        image: mcp-everything:2.1.0          # built from mcp-server/Dockerfile, loaded with `kind load`
        imagePullPolicy: IfNotPresent        # never pull: the image only exists locally
        ports:
        - { name: mcp, containerPort: 3001 }
        env:
        - name: HOST
          value: "0.0.0.0"                   # listen on all interfaces (default is localhost only)
        # The demo's "stake": a FAKE credential that get-env would leak.
        - name: FAKE_DB_PASSWORD
          value: "hunter2-demo"
        # Simulates a misconfigured tool server: by default get-env redacts names
        # containing PASSWORD/KEY/TOKEN; this turns that off. The gateway must stop it.
        - name: GET_ENV_INCLUDE_SECRETS
          value: "1"
        readinessProbe:                      # MCP needs a POST handshake, so probe the TCP port
          tcpSocket: { port: mcp }
          periodSeconds: 5
        livenessProbe:
          tcpSocket: { port: mcp }
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits:   { memory: 256Mi }
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-everything
  namespace: tools
spec:
  selector: { app: mcp-everything }
  ports:
  - name: mcp
    port: 3001
    targetPort: mcp
    appProtocol: agentgateway.dev/mcp       # tells agentgateway this port speaks MCP (Streamable HTTP)
